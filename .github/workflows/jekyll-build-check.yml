name: Jekyll Build Check

# TEMPORARY workflow to validate that the site compiles (no deploy).
on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
